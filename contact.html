<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Tool Titan API</title>
    <meta name="description" content="Get in touch with the Tool Titan team for developer support and inquiries.">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- Navigation -->
    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <span class="main-logo">TOOL TITAN</span>
                <span class="sub-logo">API</span>
            </a>
            <button class="hamburger-btn" onclick="toggleNav()" aria-label="Toggle Navigation">
                <i data-lucide="menu"></i>
            </button>
            <div class="nav-links" id="nav-links">
                <ul>
                    <li><a href="index.html"><i data-lucide="home"></i> Home</a></li>

        </div>

    <!-- Main Contact Section -->
    <main class="container">
        <section class="contact" style="display: flex; justify-content: center; align-items: center; min-height: 50vh;">
            <div class="glass-card" style="padding: 3.5rem 2.5rem; max-width: 600px; width: 100%; text-align: center;">
                <div
                    style="width: 64px; height: 64px; border-radius: 50%; background: rgba(79, 70, 229, 0.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: var(--accent);">
                    <i data-lucide="send" size="32"></i>
                </div>
                <h1 class="gradient-text">Contact Us</h1>
                <p style="margin-bottom: 2rem;">
                    Have questions, custom API requests, or need support? Reach out to us directly on Telegram for
                    instant response.
                </p>
                <a href="https://t.me/Aftabkabir" target="_blank" rel="noopener noreferrer" class="btn"
                    style="padding: 1rem 2rem; font-size: 1.1rem;">
                    <i data-lucide="message-square"></i> Reach Out on Telegram
                </a>
            </div>
        </section>
    </main>

        <div class="container">
